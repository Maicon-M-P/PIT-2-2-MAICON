<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja de Cupcakes - Vitrine</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🧁 Loja de Cupcakes</h1>
    <nav>
      <a href="index.html">Vitrine</a>
      <a href="checkout.html">Carrinho (<span id="badge-carrinho" class="badge">0</span>)</a>
      <a href="acompanhar.html">Acompanhar pedido</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main>
    <h2>Nossos cupcakes</h2>
    <div class="card">
      <label for="ordenar">Ordenar por:</label>
      <select id="ordenar">
        <option value="">Padrão</option>
        <option value="preco_asc">Mais baratos primeiro</option>
      </select>
      <label for="busca">Buscar cupcake pelo nome:</label>
      <input id="busca" type="search" placeholder="Ex.: chocolate">
    </div>
    <div id="grid-produtos" class="grid" style="margin-top:16px"></div>

    <h2>Resumo do carrinho</h2>
    <div id="carrinho-resumo" class="card"></div>
    <p><a class="btn" href="checkout.html">Ir para o checkout</a></p>
  </main>

  <footer>Projeto PIT 2 - Loja de Cupcakes gourmet</footer>

  <script src="js/api.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/vitrine.js"></script>
</body>
</html>
